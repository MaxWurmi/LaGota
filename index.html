<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichtige Frage für dich Stinker! ❤️</title>
    <!-- Canvas Confetti Library für die Sieges-Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Hellblauer Hintergrund */
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Schwebende Herzen im Hintergrund */
        .floating-heart {
            position: absolute;
            color: rgba(255, 64, 129, 0.25);
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Die Haupt-Karte mit rosa Akzenten */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(255, 64, 129, 0.15),
                        0 5px 15px rgba(0, 0, 0, 0.05);
            border: 3px solid #f8bbd0;
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .emoji-header {
            font-size: 65px;
            margin-bottom: 15px;
            animation: pulseEmoji 2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes pulseEmoji {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            color: #d81b60;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.3;
            text-shadow: 1px 1px 2px rgba(216, 27, 96, 0.1);
        }

        /* Button Container */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            min-height: 100px;
            position: relative;
        }

        button {
            border: none;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Haupt-Button: "Ja" (Rosa Gradient) */
        #btn-ja {
            background: linear-gradient(135deg, #ff4081 0%, #f50057 100%);
            color: white;
            font-size: 18px;
            padding: 15px 32px;
            z-index: 20;
            border: 2px solid #ff80ab;
            transition: font-size 0.2s ease, padding 0.2s ease, transform 0.2s ease, background 0.3s ease;
        }

        #btn-ja:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #f50057 0%, #c2185b 100%);
            box-shadow: 0 8px 20px rgba(245, 0, 87, 0.4);
        }

        /* Der ausweichende "Nein"-Button */
        #btn-nein {
            background: #90caf9;
            color: #0d47a1;
            font-size: 18px;
            padding: 15px 28px;
            border: 2px solid #64b5f6;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s ease;
            position: relative;
            z-index: 15;
            white-space: nowrap;
        }

        #btn-nein:hover {
            background: #64b5f6;
        }

        /* Erfolgsanzeige */
        .success-text {
            color: #ad1457;
            font-size: 20px;
            line-height: 1.6;
            margin-top: 10px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Schwebende Hintergrundherzen -->
    <div id="hearts-container"></div>

    <!-- Hauptkarte -->
    <div class="card" id="game-card">
        <div class="emoji-header" id="emoji">🦨</div>
        <h1 id="frage">Bist du MEIN Stinker?</h1>
        <div class="btn-container">
            <button id="btn-ja" onclick="jaGeklickt()">Ja! 🥰</button>
            <button id="btn-nein" onclick="neinGeklickt()">I bin ka STINKER ❤️‍🩹</button>
        </div>
    </div>

    <script>
        // Schwebende Hintergrund-Herzen erzeugen
        const heartsContainer = document.getElementById('hearts-container');
        const heartIcons = ['❤️', '💖', '💕', '💗', '💓', '💙'];
        
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 8 + 's';
            heart.style.animationDuration = (6 + Math.random() * 6) + 's';
            heartsContainer.appendChild(heart);
        }

        // Antworten für den Nein-Button
        const neinTexte = [
            "Bist du dir sicher? 🤔",
            "Wirklich ganz sicher? 🥺",
            "Überleg's dir noch mal! 💭",
            "Letzte Chance! ⚠️",
            "Ganz bestimmt? 💔",
            "Keine Chance für Nein! 😜",
            "Versuch's erst gar nicht! 🙈"
        ];

        let textIndex = 0;
        let jaFontSize = 18;
        let jaPaddingV = 15;
        let jaPaddingH = 32;

        function neinGeklickt() {
            const btnNein = document.getElementById('btn-nein');
            const btnJa = document.getElementById('btn-ja');
            const emoji = document.getElementById('emoji');

            // Text des Nein-Buttons verändern
            btnNein.innerText = neinTexte[textIndex];
            textIndex = (textIndex + 1) % neinTexte.length;

            // Trauriges Emoji wechseln
            const emojis = ['🥺', '💔', '😢', '😭', '🙈'];
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            // Ja-Button wachsen lassen
            jaFontSize += 6;
            jaPaddingV += 4;
            jaPaddingH += 8;
            
            btnJa.style.fontSize = jaFontSize + 'px';
            btnJa.style.padding = `${jaPaddingV}px ${jaPaddingH}px`;

            // Zufällige Positionierung für den Nein-Button (ausweichen)
            const randomX = (Math.random() - 0.5) * 220;
            const randomY = (Math.random() - 0.5) * 180;
            btnNein.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function jaGeklickt() {
            const card = document.getElementById('game-card');
            
            // Konfetti auslösen
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4081', '#f50057', '#ff80ab', '#90caf9', '#ffffff']
            });

            // Herz-Regen Effekt auslösen
            let heartInterval = setInterval(() => {
                confetti({
                    particleCount: 15,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4081', '#f50057']
                });
                confetti({
                    particleCount: 15,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4081', '#f50057']
                });
            }, 400);

            setTimeout(() => clearInterval(heartInterval), 3000);

            // Inhalt der Karte durch die Liebesbotschaft ersetzen
            card.innerHTML = `
                <div class="emoji-header">🎉💖🥳</div>
                <h1>😻 Du bist sogoa da ALLER GRÖßTE STINKER! 😼</h1>
                <p class="success-text">
                    🐭 Viel Spaß noch Mausi! 🐭
                </p>
            `;
        }
    </script>
</body>
</html>
